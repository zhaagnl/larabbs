services:
  app:
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: larabbs_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./.psysh:/tmp/.psysh
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - COMPOSER_HOME=/var/www/.composer
      - XDG_CONFIG_HOME=/tmp
    networks:
      - laravel


  webserver:
    image: nginx:alpine
    container_name: larabbs_nginx
    restart: unless-stopped
    ports:
      - "30091:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: larabbs_db   # 两个项目可分别命名，比如 larabbs_db / weibo_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "33061:3306"   # a项目用 33061，b项目用 33062，避免冲突
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel

  # mailhog:
  #   image: mailhog/mailhog
  #   container_name: larabbs_mailhog
  #   ports:
  #     - "8025:8025"   # Web 管理界面
  #     - "1025:1025"   # SMTP 端口（应用发邮件用）
  #   networks:
  #     - laravel

networks:
  laravel:
    driver: bridge

volumes:
  db_data:
